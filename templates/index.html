<!DOCTYPE html>
<html>
<head>
    <title>Film Recommender</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .status { padding: 10px; border-radius: 5px; margin: 10px 0; }
        .healthy { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Film Recommender</h1>
        <div class="status" id="status">Checking system status...</div>
        
        <h2>System Information</h2>
        <ul>
            <li><strong>API Gateway:</strong> <span id="apiUrl">{{ api_url }}</span></li>
            <li><strong>User Pool ID:</strong> <span id="userPoolId">{{ user_pool_id }}</span></li>
            <li><strong>Client ID:</strong> <span id="clientId">{{ client_id }}</span></li>
        </ul>
        
        <button onclick="checkHealth()">Check Health</button>
        <button onclick="testAPI()">Test API</button>
        
        <div id="results" style="margin-top: 20px;"></div>
    </div>

    <script>
        async function checkHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                document.getElementById('status').className = 'status healthy';
                document.getElementById('status').innerHTML = 
                    `✅ System Healthy - Region: ${data.region} - API: ${data.api_available ? 'Available' : 'Unavailable'}`;
            } catch (error) {
                document.getElementById('status').className = 'status error';
                document.getElementById('status').innerHTML = '❌ Health Check Failed';
            }
        }
        
        async function testAPI() {
            try {
                const response = await fetch('/api/movies');
                const data = await response.json();
                document.getElementById('results').innerHTML = 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('results').innerHTML = 
                    `<div class="status error">API Test Failed: ${error.message}</div>`;
            }
        }
        
        // Check health on page load
        checkHealth();
    </script>
</body>
</html>
