AWSTemplateFormatVersion: '2010-09-09'
Description: Film Recommender CICD Pipeline with complete permissions

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub repository owner
  GitHubRepo:
    Type: String
    Description: GitHub repository name
  GitHubBranch:
    Type: String
    Description: GitHub branch to monitor
    Default: main
  GitHubToken:
    Type: String
    NoEcho: true
    Description: GitHub OAuth token
  EBApplicationName:
    Type: String
    Description: Elastic Beanstalk application name
    Default: film-recommender-final
  EBEnvironmentName:
    Type: String
    Description: Elastic Beanstalk environment name
    Default: film-recommender-final-env
  LambdaStackName:
    Type: String
    Description: Lambda CloudFormation stack name
    Default: film-recommender-final-lambda-stack
  PipelineVersion:
    Type: String
    Description: Pipeline version identifier
    Default: v1

Resources:
  ArtifactStoreBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Modificato per usare un nome più conforme alle regole S3 (senza lettere maiuscole)
      BucketName: !Sub 'film-pipe-artifact-${PipelineVersion}-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldArtifacts
            Status: Enabled
            ExpirationInDays: 7

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      # Lasciato AdministratorAccess per semplicità e per garantire che CodeBuild possa fare tutto il necessario
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Policies:
        - PolicyName: ElasticBeanstalkExtendedAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # Permessi aggiuntivi richiesti da CodeBuild
                  - elasticbeanstalk:*
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeLaunchConfigurations
                  - autoscaling:DescribeScalingActivities
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:AttachRolePolicy
                  - iam:PutRolePolicy
                  - iam:PassRole
                Resource: "*"

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub 'film-build-${PipelineVersion}'
      Description: Build project for Film Recommender application
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:4.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: PIPELINE_VERSION
            Value: !Ref PipelineVersion
          - Name: LAMBDA_STACK_NAME
            Value: !Ref LambdaStackName
      Artifacts:
        Type: CODEPIPELINE
      ServiceRole: !Ref CodeBuildRole
      TimeoutInMinutes: 30

  CloudFormationServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      # --- MODIFICA CHIAVE QUI: Uso delle Policy Gestite per risolvere l'errore ---
      ManagedPolicyArns:
        # Policy standard di CodePipeline (per i suoi servizi interni)
        - arn:aws:iam::aws:policy/AWSCodePipelineServiceRole
        # Policy completa di Elastic Beanstalk (risolve l'errore autoscaling:DescribeAutoScalingGroups)
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkFullAccess
        # Policy per l'azione di deploy CloudFormation (per lo step Lambda)
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
      Policies:
        # Aggiungo la policy PassRole separata per poter assumere gli altri ruoli
        - PolicyName: CodePipelinePassRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt CodeBuildRole.Arn
                  - !GetAtt CloudFormationServiceRole.Arn
                  # Aggiungi qui l'ARN del ruolo di servizio Elastic Beanstalk (se CodePipeline lo assume direttamente)
                  # Esempio: arn:aws:iam::023048164072:role/aws-elasticbeanstalk-ec2-role
# ----------------------------------------------------------------------------------

  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub 'film-pipe-${PipelineVersion}'
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactStoreBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub-Source
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Version: 1
                Provider: GitHub
              Configuration:
                Owner: !Ref GitHubOwner
                Repo: !Ref GitHubRepo
                Branch: !Ref GitHubBranch
                OAuthToken: !Ref GitHubToken
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Build-And-Package
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: Deploy-Lambda
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: 1
              InputArtifacts:
                - Name: BuildArtifact
              Configuration:
                StackName: !Ref LambdaStackName
                ActionMode: CREATE_UPDATE
                TemplatePath: BuildArtifact::packaged.yaml
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt CloudFormationServiceRole.Arn
              RunOrder: 1
            - Name: Deploy-Frontend
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ElasticBeanstalk
                Version: 1
              InputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ApplicationName: !Ref EBApplicationName
                EnvironmentName: !Ref EBEnvironmentName
              RunOrder: 2

Outputs:
  PipelineUrl:
    Description: CodePipeline Console URL
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/film-pipe-${PipelineVersion}/view'
  PipelineVersion:
    Description: Pipeline Version Deployed
    Value: !Ref PipelineVersion
  BuildProjectName:
    Description: CodeBuild Project Name
    Value: !Ref CodeBuildProject
  ArtifactBucket:
    Description: S3 Artifact Bucket
    Value: !Ref ArtifactStoreBucket