AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  FilmRecommenderLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: FilmRecommenderLambda
      Handler: lambda_function.lambda_handler
      Runtime: python3.9
      Events:
        RecommendApi:
          Type: Api
          Properties:
            Path: /api/recommend
            Method: POST
        AnalyticsApi:
          Type: Api
          Properties:
            Path: /api/analytics
            Method: GET
        HealthApi:
          Type: Api
          Properties:
            Path: /api/health
            Method: GET
      Environment:
        Variables:
          USER_TABLE: FilmRecommender-Users
          ANALYTICS_TABLE: FilmRecommender-Analytics
    Metadata:
      SamResourceId: FilmRecommenderLambda
Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
