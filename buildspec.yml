version: 0.2

env:
  variables:
    APP_NAME: "film-recommender-final"
    ECR_REPO: "film-recommender"
    ENV_NAME: "film-recommender-final-env"
    REGION: "eu-west-1"
    SOLUTION_STACK: "64bit Amazon Linux 2023 v4.7.2 running Docker"
    LAMBDA_STACK_NAME: "film-recommender-final-lambda"
    PIPELINE_VERSION: "v1"

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "=== INSTALLAZIONE DEPENDENZE ==="
      - yum install -y jq git
      - pip install --upgrade aws-sam-cli boto3 docker

  pre_build:
    commands:
      - echo "=== CONFIGURAZIONE PRE-BUILD ==="
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - S3_BUCKET="film-pipe-$PIPELINE_VERSION-$ACCOUNT_ID"
      - ECR_URL="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$ECR_REPO"
      - echo "Account ID: $ACCOUNT_ID"
      - echo "S3 Bucket: $S3_BUCKET"
      - echo "ECR URL: $ECR_URL"
      
      # Verifica/Crea bucket S3
      - if ! aws s3 ls "s3://$S3_BUCKET" --region $REGION &>/dev/null; then aws s3 mb "s3://$S3_BUCKET" --region $REGION; echo "🪣 Bucket S3 creato"; else echo "✅ Bucket S3 già esistente"; fi
      
      # Login ECR
      - echo "🔐 Login a ECR..."
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_URL
      
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG="pipeline-$COMMIT_HASH"
      - echo "🏷️ Image tag: $IMAGE_TAG"

  build:
    commands:
      - echo "=== FASE BUILD ==="
      # Build Docker image
      - echo "🐳 Building Docker image..."
      - docker build -t $ECR_REPO .
      - docker tag $ECR_REPO:latest $ECR_URL:latest
      - docker tag $ECR_REPO:latest $ECR_URL:$IMAGE_TAG
      
      # SAM packaging
      - echo "📦 Packaging Serverless application (SAM)..."
      - sam build
      - sam package --template-file template.yaml --output-template-file packaged.yaml --s3-bucket $S3_BUCKET --region $REGION

      # Prepara deployment package per Elastic Beanstalk
      - echo "📁 Preparazione deployment package per Elastic Beanstalk..."
      - mkdir -p .ebextensions
      - zip -r deployment.zip dockerrun.aws.json .ebextensions/
      - echo "✅ Deployment package creato"

  post_build:
    commands:
      - echo "=== FASE POST-BUILD ==="
      # Push Docker images
      - echo "📤 Pushing Docker images to ECR..."
      - docker push $ECR_URL:latest
      - docker push $ECR_URL:$IMAGE_TAG
      - echo "✅ Immagini Docker pushate"
      
      # Upload deployment package to S3
      - echo "📤 Upload deployment package to S3..."
      - aws s3 cp deployment.zip "s3://$S3_BUCKET/deployment.zip"
      - echo "✅ Package caricato su S3"
      
      # Crea/aggiorna versione Elastic Beanstalk
      - echo "🚀 Deploy to Elastic Beanstalk..."
      - VERSION_LABEL="pipeline-$IMAGE_TAG"
      
      # Crea versione applicazione
      - aws elasticbeanstalk create-application-version --application-name "$APP_NAME" --version-label "$VERSION_LABEL" --source-bundle "S3Bucket=$S3_BUCKET,S3Key=deployment.zip" --region "$REGION" || echo "ℹ️ Versione già esistente"
      
      # Aggiorna ambiente
      - aws elasticbeanstalk update-environment --environment-name "$ENV_NAME" --version-label "$VERSION_LABEL" --region "$REGION"
      - echo "✅ Deploy Elastic Beanstalk completato"
      
      # SAM Deploy
      - echo "🚀 Deploy SAM Stack..."
      - sam deploy --template-file packaged.yaml --stack-name $LAMBDA_STACK_NAME --capabilities CAPABILITY_IAM --region $REGION --no-fail-on-empty-changeset
      - echo "✅ Deploy SAM completato"
      
      # File per CodePipeline (uso del formato CodeBuild per definire l'immagine ECR)
      - echo "📝 Writing image definitions file..."
      - printf '[{"name":"film-recommender","imageUri":"%s"}]' $ECR_URL:latest > imagedefinitions.json

artifacts:
  files:
    - '**/*'
  secondary-artifacts:
    samTemplate:
      files:
        - packaged.yaml
    imageDef:
      files:
        - imagedefinitions.json