version: 0.2

phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - yum install -y jq || echo "jq install fallito (non critico se già installato)."
      - pip install aws-sam-cli
      
  pre_build:
    commands:
      # Login a ECR
      - echo "Logging in to Amazon ECR..."
      - aws --version
      - $(aws ecr get-login --region $AWS_DEFAULT_REGION --no-include-email)
      - REPOSITORY_URI=$(aws ecr describe-repositories --repository-names film-recommender --region $AWS_DEFAULT_REGION --query 'repositories[0].repositoryUri' --output text)
      - echo "ECR Repository: $REPOSITORY_URI"
      
      # Recupera il nome del bucket S3 corrente dalla pipeline
      - echo "Getting current pipeline S3 bucket..."
      - PIPELINE_NAME="film-pipe-1"  # Nome fisso della pipeline corrente
      - S3_BUCKET="${PIPELINE_NAME}-${AWS_ACCOUNT_ID}"
      - echo "Using S3 bucket: $S3_BUCKET"
      
      # Crea il bucket se non esiste
      - echo "Creating S3 bucket if not exists..."
      - aws s3 mb s3://$S3_BUCKET --region $AWS_DEFAULT_REGION 2>/dev/null || echo "Bucket already exists or creation failed"
      
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')
      - echo "Image tag: $IMAGE_TAG"
      
  build:
    commands:
      # 1. Costruzione e tag dell'immagine Docker
      - echo "Building Docker image..."
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
      
      # 2. Packaging SAM per il deploy Lambda - USA LA VARIABILE CORRETTA
      - echo "Packaging Serverless application (SAM)..."
      - echo "Using S3 bucket for SAM: $S3_BUCKET"
      - sam package --template-file template.yaml --output-template-file packaged.yaml --s3-bucket $S3_BUCKET

  post_build:
    commands:
      # Push delle immagini Docker a ECR
      - echo "Pushing Docker images to ECR..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Writing image definitions file..."
      - printf '[{"name":"film-recommender","imageUri":"%s"}]' $REPOSITORY_URI:latest > imagedefinitions.json
      
artifacts:
  files:
    - '**/*'
  secondary-artifacts:
    samTemplate:
      files:
        - packaged.yaml
    imageDef:
      files:
        - imagedefinitions.json