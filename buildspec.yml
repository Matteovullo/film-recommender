version: 0.2

phases:
  install:
    commands:
      # CORREZIONE 1: Usa YUM (gestore di pacchetti per Amazon Linux) e installa jq
      - echo "Installing jq and pip dependencies..."
      - yum install -y jq || echo "jq install fallito (non critico se già installato)."
      - pip install aws-sam-cli
      
  pre_build:
    commands:
      # Login a ECR (Repository AWS)
      - echo "Logging in to Amazon ECR..."
      - aws --version
      - $(aws ecr get-login --region $AWS_DEFAULT_REGION --no-include-email)
      - REPOSITORY_URI=023048164072.dkr.ecr.eu-west-1.amazonaws.com/film-recommender
      
      # --- AUTHENTICATION DOCKER HUB ---
      - echo "Authenticating to Docker Hub..."
      - export DOCKER_SECRET_NAME="dockerhub-auth-secret" # Nome del Secret in Secrets Manager
      
      # Recupera le credenziali da Secrets Manager (richiede jq)
      - DOCKER_CREDENTIALS=$(aws secretsmanager get-secret-value --secret-id $DOCKER_SECRET_NAME --region $AWS_DEFAULT_REGION --query SecretString --output text)
      - DOCKER_USERNAME=$(echo $DOCKER_CREDENTIALS | jq -r '.username')
      - DOCKER_PASSWORD=$(echo $DOCKER_CREDENTIALS | jq -r '.password')

      # Login a Docker Hub 
      - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
      - echo "Docker Hub Login Succeeded"
      # -------------------------------------------------------------
      
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')
      
  build:
    commands:
      # 1. Costruzione e tag dell'immagine Docker principale
      - echo "Building Docker image..."
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
      
      # 2. Packaging SAM per il deploy Lambda
      - echo "Packaging Serverless application (SAM)..."
      - sam package --template-file template.yaml --output-template-file packaged.yaml --s3-bucket film-recommender-pipeline-v7-023048164072

  post_build:
    commands:
      # Push delle immagini Docker a ECR
      - echo "Pushing Docker images to ECR..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Writing image definitions file..."
      - printf '[{"name":"film-recommender","imageUri":"%s"}]' $REPOSITORY_URI:latest > imagedefinitions.json
      
artifacts:
  files:
    - '**/*'
  secondary-artifacts:
    samTemplate:
      files:
        - packaged.yaml
    imageDef:
      files:
        - imagedefinitions.json